  <script>
  (()=>{
    const root=document.getElementById('ice-jade-sanctuary');if(!root||root.dataset.ready)return;root.dataset.ready='true';
    const q=s=>root.querySelector(s),world=q('.ij-world'),image=q('.ij-photo'),land=q('.ij-landscape'),particles=q('.ij-particles'),panel=q('.ij-scroll'),audioButton=q('.ij-audio');
    const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    let alive=true,visible=true,inside=false,crossing=false,scrollOpen=false,short=false,holding=false,dragging=false,holdStart=0,startX=0,startY=0,mouseX=.68,mouseY=.42,panX=0,panY=0,zoom=0,zoomTarget=0,hold=0,moveSoundAt=0;
    let audio=null,audioOn=false,audioBusy=false,mix=null,dry=null,wet=null,verb=null,transport=null,nextPhrase=0,phraseNo=0,audioTick=null,noise=null,impulse=null,masterNodes=[];
    const voices=new Set(),buffers=new Map();const scale=[146.832,195.998,220,261.626,293.665,391.995,440,523.251,587.33];
    const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
    function impulseBuffer(){const len=Math.floor(audio.sampleRate*5.2),b=audio.createBuffer(2,len,audio.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);let smooth=0;for(let i=0;i<len;i++){smooth=smooth*.6+(Math.random()*2-1)*.4;d[i]=smooth*Math.pow(1-i/len,2.7);}}return b;}
    function noiseBuffer(){const b=audio.createBuffer(1,audio.sampleRate*6,audio.sampleRate),d=b.getChannelData(0);let smooth=0;for(let i=0;i<d.length;i++){smooth=.975*smooth+.025*(Math.random()*2-1);d[i]=smooth*2;}return b;}
    function track(source){voices.add(source);source.onended=()=>voices.delete(source);return source;}
    function stringBuffer(f){const key=Math.round(f*100);if(buffers.has(key))return buffers.get(key);const dur=4.4,b=audio.createBuffer(1,Math.ceil(audio.sampleRate*dur),audio.sampleRate),d=b.getChannelData(0);let n=0;for(let i=0;i<d.length;i++){const t=i/audio.sampleRate;let v=0;for(let h=1;h<=10;h++){const amplitude=Math.exp(-t*(.7+h*.28))/Math.pow(h,1.22);v+=Math.sin(2*Math.PI*f*h*(1+.00006*h*h)*t)*amplitude;}n=.6*n+.4*(Math.random()*2-1);d[i]=(v*.48+n*.16*Math.exp(-t*75))*(1-Math.exp(-t*650));}buffers.set(key,b);return b;}
    function string(f,time=audio.currentTime,gain=.14){if(!audioOn)return;const s=track(audio.createBufferSource()),g=audio.createGain(),filter=audio.createBiquadFilter();s.buffer=stringBuffer(f);filter.type='lowpass';filter.frequency.value=3200;g.gain.value=gain;s.connect(filter);filter.connect(g);g.connect(dry);g.connect(wet);s.start(time);}
    function flute(f,time,gain=.075,duration=3.8){if(!audioOn)return;const o=track(audio.createOscillator()),g=audio.createGain(),breath=track(audio.createBufferSource()),bg=audio.createGain(),bp=audio.createBiquadFilter(),v=audio.createOscillator(),vg=audio.createGain();o.type='sine';o.frequency.value=f;v.frequency.value=4.2;vg.gain.value=3.2;v.connect(vg);vg.connect(o.detune);g.gain.setValueAtTime(.0001,time);g.gain.exponentialRampToValueAtTime(gain,time+.46);g.gain.setTargetAtTime(gain*.7,time+1.1,.5);g.gain.exponentialRampToValueAtTime(.0001,time+duration);o.connect(g);g.connect(dry);g.connect(wet);breath.buffer=noise;bp.type='bandpass';bp.frequency.value=f*2.2;bp.Q.value=.6;bg.gain.setValueAtTime(.0001,time);bg.gain.linearRampToValueAtTime(gain*.27,time+.6);bg.gain.linearRampToValueAtTime(0,time+duration);breath.connect(bp);bp.connect(bg);bg.connect(wet);o.start(time);o.stop(time+duration+.1);breath.start(time);breath.stop(time+duration+.1);v.start(time);v.stop(time+duration+.1);}
